<app-general-header></app-general-header>

<section class="announcements-hero">
  <h1>{{ 'ANNOUNCEMENTS.HERO_TITLE' | translate }}</h1>
  <p class="announcements-subtitle">{{ 'ANNOUNCEMENTS.HERO_SUBTITLE' | translate }}</p>
</section>

<div class="announcements-body">
    <div class="announcements-list">
        @for (announcement of announcements; track announcement.title) {
            <app-announcement-blog-post [announcement]="announcement"></app-announcement-blog-post>
        } @empty {
            <p class="announcements-empty">{{ 'ANNOUNCEMENTS.EMPTY' | translate }}</p>
        }
    </div>
</div>

<app-general-footer></app-general-footer>
